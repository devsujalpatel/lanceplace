services:
  redis:
    image: redis:7-alpine
    container_name: lanceplace-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lanceplace}

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    command:
      - sh
      - -c
      - >
        exec redi-server
        --requirepass "$${REDIS_PASSWORD}"
        --appendonly yes
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD-SHELL", 'redis-cli - "$${REDIS_PASSSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: lanceplace-nats
    restart: unless-stopped

    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data/jetstream

    command:
      - "--jetstream"
      - "--store_dir=/data/jetstream"
      - "--http_port=8222"

volumes:
    redis_data:
    nats_data:
